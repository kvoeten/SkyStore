name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kvoeten/skystore

jobs:
  release:
    if: github.repository == 'kvoeten/SkyStore'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Validate the application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Read the immutable catalog asset lock
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          lock=deploy/catalog-assets.lock.json
          {
            echo "release=$(jq -er '.release | select(test("^catalog-assets-[0-9A-Za-z._-]+$"))' "$lock")"
            echo "asset=$(jq -er '.asset | select(test("^[0-9A-Za-z._-]+\\.tar\\.gz$"))' "$lock")"
            echo "sha256=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "$lock")"
            echo "targets_sha256=$(jq -er '.targetsSha256 | select(test("^[a-f0-9]{64}$"))' "$lock")"
            echo "report_sha256=$(jq -er '.reportSha256 | select(test("^[a-f0-9]{64}$"))' "$lock")"
            echo "bytes=$(jq -er '.bytes | select(type == "number" and . > 0)' "$lock")"
            echo "files=$(jq -er '.files | select(type == "number" and . > 0)' "$lock")"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the catalog render bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_RELEASE: ${{ steps.catalog.outputs.release }}
          ASSET_NAME: ${{ steps.catalog.outputs.asset }}
          ASSET_SHA256: ${{ steps.catalog.outputs.sha256 }}
          TARGETS_SHA256: ${{ steps.catalog.outputs.targets_sha256 }}
          REPORT_SHA256: ${{ steps.catalog.outputs.report_sha256 }}
          ASSET_BYTES: ${{ steps.catalog.outputs.bytes }}
          ASSET_FILES: ${{ steps.catalog.outputs.files }}
        run: |
          set -euo pipefail
          mkdir -p _catalog-download _catalog-bundle
          gh release download "$ASSET_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir _catalog-download
          test "$(stat -c %s "_catalog-download/$ASSET_NAME")" = "$ASSET_BYTES"
          printf '%s  %s\n' "$ASSET_SHA256" "_catalog-download/$ASSET_NAME" | sha256sum --check --strict -
          tar -xzf "_catalog-download/$ASSET_NAME" -C _catalog-bundle
          printf '%s  %s\n' "$TARGETS_SHA256" "_catalog-bundle/item-renders/render-targets.json" | sha256sum --check --strict -
          printf '%s  %s\n' "$REPORT_SHA256" "_catalog-bundle/item-renders/render-report.json" | sha256sum --check --strict -
          test "$(find _catalog-bundle/item-renders/images -type f -name '*.png' | wc -l)" = "$ASSET_FILES"
          node --input-type=module <<'NODE'
          import { access, readFile } from "node:fs/promises";
          const pairs = [
            ["catalog/generated/skystore-catalog-current.json", "_catalog-bundle/skystore-catalog-current.json"],
            ["catalog/generated/item-renders/render-targets.json", "_catalog-bundle/item-renders/render-targets.json"],
            ["catalog/generated/item-renders/render-report.json", "_catalog-bundle/item-renders/render-report.json"],
            ["catalog/generated/item-renders/artwork-manifest.json", "_catalog-bundle/item-renders/artwork-manifest.json"]
          ];
          for (const [tracked, bundled] of pairs) {
            const left = JSON.stringify(JSON.parse(await readFile(tracked, "utf8")));
            const right = JSON.stringify(JSON.parse(await readFile(bundled, "utf8")));
            if (left !== right) throw new Error(`${bundled} does not match ${tracked}.`);
          }
          const artwork = JSON.parse(await readFile("_catalog-bundle/item-renders/artwork-manifest.json", "utf8"));
          const report = JSON.parse(await readFile("_catalog-bundle/item-renders/render-report.json", "utf8"));
          if (Object.keys(artwork).length !== report.renderedCount || report.renderedCount !== report.targetCount) throw new Error("Render manifest and report counts differ.");
          for (const path of Object.values(artwork)) {
            const match = /^\/item-renders\/([0-9a-f-]{36}-v[0-9]+-[0-9a-f]{12}\.png)$/.exec(path);
            if (!match) throw new Error(`Unsafe rendered image path ${path}.`);
            await access(`_catalog-bundle/item-renders/images/${match[1]}`);
          }
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            SKYSTORE_RELEASE_VERSION=${{ github.ref_name }}
            SKYSTORE_RELEASE_REVISION=${{ github.sha }}
          build-contexts: |
            catalog_bundle=./_catalog-bundle
          cache-from: type=gha,scope=skystore-release-amd64
          cache-to: type=gha,mode=max,scope=skystore-release-amd64
          provenance: false
          sbom: true

      - name: Attest the image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify the published image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$DIGEST"
          docker run --rm --entrypoint sh "$IMAGE_NAME@$DIGEST" -ec '
            test -s /opt/skystore/catalog/skystore-catalog-current.json
            test -s /opt/skystore/catalog/item-renders/render-report.json
            expected="$(node -p "require('/opt/skystore/catalog/item-renders/render-report.json').renderedCount")"
            test "$(find /var/lib/skystore/catalog-images/renders -type f -name '*.png' | wc -l)" -eq "$expected"
          '

      - name: Publish the stable update channel
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker buildx imagetools create --tag "$IMAGE_NAME:stable" "$IMAGE_NAME@$DIGEST"
            stable_digest="sha256:$(docker buildx imagetools inspect "$IMAGE_NAME:stable" --raw | sha256sum | cut -d' ' -f1)"
            test "$stable_digest" = "$DIGEST"
          fi

      - name: Render the TrueNAS release bundle
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/render-truenas-release.mjs \
            --template deploy/truenas/skystore.yaml \
            --image "$IMAGE_NAME@$DIGEST" \
            --output dist/skystore-truenas.yaml
          node scripts/render-truenas-release.mjs \
            --template deploy/truenas/skystore.yaml \
            --image "$IMAGE_NAME:stable" \
            --output dist/skystore-truenas-auto.yaml \
            --allow-stable
          cp deploy/truenas/README.md dist/TRUENAS-README.md
          cp deploy/truenas/nginx.conf.example dist/nginx.conf.example
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > dist/image-reference.txt
          printf '%s:stable\n' "$IMAGE_NAME" > dist/automatic-image-reference.txt
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "SkyStore $GITHUB_REF_NAME" --generate-notes dist/*
          fi
