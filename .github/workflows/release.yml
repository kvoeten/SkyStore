name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kvoeten/skystore

jobs:
  release:
    if: github.repository == 'kvoeten/SkyStore'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Validate the application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Verify the tracked catalog mapping
        run: |
          npm run catalog:icons:uesp:map
          git diff --exit-code -- catalog/generated/uesp-icons/uesp-icon-mapping.json

      - name: Read the immutable catalog asset lock
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          lock=deploy/catalog-assets.lock.json
          echo "release=$(jq -er '.release | select(test("^catalog-assets-[0-9A-Za-z._-]+$"))' "$lock")" >> "$GITHUB_OUTPUT"
          echo "asset=$(jq -er '.asset | select(test("^[0-9A-Za-z._-]+\\.tar\\.gz$"))' "$lock")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "$lock")" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(jq -er '.manifestSha256 | select(test("^[a-f0-9]{64}$"))' "$lock")" >> "$GITHUB_OUTPUT"
          echo "bytes=$(jq -er '.bytes | select(type == "number" and . > 0)' "$lock")" >> "$GITHUB_OUTPUT"
          echo "files=$(jq -er '.files | select(type == "number" and . > 0)' "$lock")" >> "$GITHUB_OUTPUT"

      - name: Download and verify the private catalog bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_RELEASE: ${{ steps.catalog.outputs.release }}
          ASSET_NAME: ${{ steps.catalog.outputs.asset }}
          ASSET_SHA256: ${{ steps.catalog.outputs.sha256 }}
          MANIFEST_SHA256: ${{ steps.catalog.outputs.manifest_sha256 }}
          ASSET_BYTES: ${{ steps.catalog.outputs.bytes }}
          ASSET_FILES: ${{ steps.catalog.outputs.files }}
        run: |
          set -euo pipefail
          mkdir -p _catalog-download _catalog-bundle
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$ASSET_RELEASE\" and .draft == true) | .id" | head -n 1)"
          test -n "$release_id"
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq ".[] | select(.name == \"$ASSET_NAME\" and .state == \"uploaded\") | .id" | head -n 1)"
          test -n "$asset_id"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "_catalog-download/$ASSET_NAME"
          test "$(stat -c %s "_catalog-download/$ASSET_NAME")" = "$ASSET_BYTES"
          printf '%s  %s\n' "$ASSET_SHA256" "_catalog-download/$ASSET_NAME" | sha256sum --check --strict -
          tar -xzf "_catalog-download/$ASSET_NAME" -C _catalog-bundle
          printf '%s  %s\n' "$MANIFEST_SHA256" "_catalog-bundle/uesp-icons/uesp-icons-manifest.json" | sha256sum --check --strict -
          test "$(find _catalog-bundle/uesp-icons/assets -type f | wc -l)" = "$ASSET_FILES"
          npm run catalog:icons:uesp:hydrate -- --output _catalog-bundle/uesp-icons --offline --concurrency 8
          cmp catalog/generated/skystore-catalog-current.json _catalog-bundle/skystore-catalog-current.json
          cmp catalog/generated/uesp-icons/uesp-icon-mapping.json _catalog-bundle/uesp-icons/uesp-icon-mapping.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            SKYSTORE_RELEASE_VERSION=${{ github.ref_name }}
            SKYSTORE_RELEASE_REVISION=${{ github.sha }}
          build-contexts: |
            catalog_bundle=./_catalog-bundle
          cache-from: type=gha,scope=skystore-release-amd64
          cache-to: type=gha,mode=max,scope=skystore-release-amd64
          provenance: false
          sbom: true

      - name: Attest the image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify the published image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$DIGEST"
          docker run --rm --entrypoint sh "$IMAGE_NAME@$DIGEST" -ec '
            test -s /opt/skystore/catalog/skystore-catalog-current.json
            test -s /opt/skystore/catalog/uesp-icons/uesp-icon-mapping.json
            test "$(find /var/lib/skystore/catalog-images/uesp -type f | wc -l)" -eq 2973
          '

      - name: Render the TrueNAS release bundle
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/render-truenas-release.mjs \
            --template deploy/truenas/skystore.yaml \
            --image "$IMAGE_NAME@$DIGEST" \
            --output dist/skystore-truenas.yaml
          cp deploy/truenas/README.md dist/TRUENAS-README.md
          cp deploy/truenas/nginx.conf.example dist/nginx.conf.example
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > dist/image-reference.txt
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "SkyStore $GITHUB_REF_NAME" --generate-notes dist/*
          fi
