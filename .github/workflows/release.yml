name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kvoeten/skystore

jobs:
  release:
    if: github.repository == 'kvoeten/SkyStore'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Validate the application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Restore the verified icon cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: catalog/generated/uesp-icons/assets
          key: uesp-icons-${{ runner.os }}-${{ hashFiles('catalog/generated/uesp-icons/uesp-icons-manifest.json') }}
          restore-keys: |
            uesp-icons-${{ runner.os }}-

      - name: Hydrate and verify release imagery
        run: |
          npm run catalog:icons:uesp:hydrate -- --concurrency 3
          npm run catalog:icons:uesp:map
          git diff --exit-code -- catalog/generated/uesp-icons/uesp-icon-mapping.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            SKYSTORE_RELEASE_VERSION=${{ github.ref_name }}
            SKYSTORE_RELEASE_REVISION=${{ github.sha }}
          build-contexts: |
            catalog_bundle=./catalog/generated
          cache-from: type=gha,scope=skystore-release-amd64
          cache-to: type=gha,mode=max,scope=skystore-release-amd64
          provenance: false
          sbom: true

      - name: Attest the image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify the published image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$DIGEST"
          docker run --rm --entrypoint sh "$IMAGE_NAME@$DIGEST" -ec '
            test -s /opt/skystore/catalog/skystore-catalog-current.json
            test -s /opt/skystore/catalog/uesp-icons/uesp-icon-mapping.json
            test "$(find /var/lib/skystore/catalog-images/uesp -type f | wc -l)" -eq 2973
          '

      - name: Render the TrueNAS release bundle
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/render-truenas-release.mjs \
            --template deploy/truenas/skystore.yaml \
            --image "$IMAGE_NAME@$DIGEST" \
            --output dist/skystore-truenas.yaml
          cp deploy/truenas/README.md dist/TRUENAS-README.md
          cp deploy/truenas/nginx.conf.example dist/nginx.conf.example
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > dist/image-reference.txt
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "SkyStore $GITHUB_REF_NAME" --generate-notes dist/*
          fi
